name: Test private ECR repository - no credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without AWS credentials (expect failure)
        id: action
        uses: .
        with:
          public: 'false'
          repository: test-repo
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_REGION: us-east-1

      - name: Assert action failed due to missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
