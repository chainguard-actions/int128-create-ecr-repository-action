name: Test ECR repository creation with lifecycle and repository policies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: create-ecr-with-policies
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          public: 'false'
          repository: test-repo-with-policies
          lifecycle-policy: ${{ github.workspace }}/pristine/int128--create-ecr-repository-action/v1.473.0/tests/fixtures/lifecycle-policy.json
          repository-policy: ${{ github.workspace }}/pristine/int128--create-ecr-repository-action/v1.473.0/tests/fixtures/repository-policy.json

      - name: Assert action was invoked with policy inputs
        env:
          OUTCOME: ${{ steps.create-ecr-with-policies.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an AWS error.
          # It should NOT fail due to missing policy files or structural issues.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with policy inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
