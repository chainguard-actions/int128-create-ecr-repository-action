name: Test public registry rejects lifecycle policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'true'
          repository: public-repo
          lifecycle-policy: tests/fixtures/lifecycle-policy.json
      - name: Assert action failed and produced no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.repository-uri }}
        run: |
          echo "outcome: $OUTCOME"
          echo "repository-uri: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since ECR Public does not support lifecycle policy"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: repository-uri should be empty"
            exit 1
          fi
          echo "PASS"
