name: Test ECR repository creation with repository policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'false'
          repository: test/my-repo-with-repo-policy
          repository-policy: tests/fixtures/repository-policy.json
      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPO_URI: ${{ steps.action.outputs.repository-uri }}
        run: |
          echo "outcome: $OUTCOME"
          echo "repository-uri: $REPO_URI"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPO_URI" ]; then
              echo "FAIL: action succeeded but repository-uri output is empty"
              exit 1
            fi
            echo "PASS: got repository-uri='$REPO_URI'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
