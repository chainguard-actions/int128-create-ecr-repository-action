name: Test private ECR repository creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock AWS credentials
        run: |
          # Provide fake AWS credentials so the SDK initializes
          # The action will fail at the API call level, not at credential loading
          echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"

      - id: create-repo
        uses: .
        with:
          public: 'false'
          repository: test/my-private-repo
        continue-on-error: true

      - name: Assert action ran (output or error)
        env:
          OUTCOME: ${{ steps.create-repo.outcome }}
          REPO_URI: ${{ steps.create-repo.outputs.repository-uri }}
        run: |
          echo "outcome: $OUTCOME"
          echo "repository-uri: $REPO_URI"
          # The action should either succeed (real AWS creds) or fail with an AWS error
          # It should NOT fail due to missing inputs or misconfiguration
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded, repository-uri=$REPO_URI"
            if [ -z "$REPO_URI" ]; then
              echo "FAIL: expected repository-uri to be set on success"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without real AWS credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
