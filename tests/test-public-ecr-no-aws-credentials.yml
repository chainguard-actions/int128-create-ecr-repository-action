name: Test public ECR repository creation without AWS credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Use invalid credentials to force an authentication failure
          # regardless of any ambient credentials in the environment
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7INVALID
          AWS_SECRET_ACCESS_KEY: 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
          AWS_SESSION_TOKEN: ''
          AWS_DEFAULT_REGION: us-east-1
          # Disable all other credential sources
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ''
          AWS_CONTAINER_CREDENTIALS_FULL_URI: ''
          AWS_WEB_IDENTITY_TOKEN_FILE: ''
          AWS_ROLE_ARN: ''
          AWS_PROFILE: ''
        with:
          public: 'true'
          repository: test-public-repo-invalid-creds

      - name: Assert action failed due to invalid AWS credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid AWS credentials"
