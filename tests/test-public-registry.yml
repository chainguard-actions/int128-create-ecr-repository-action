name: Test public ECR registry repository creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'true'
          repository: my-public-test-repo
      - name: Assert action ran and produced output or failed gracefully (no AWS creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPO_URI: ${{ steps.action.outputs.repository-uri }}
        run: |
          echo "outcome: $OUTCOME"
          echo "repository-uri: $REPO_URI"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REPO_URI" ]; then
              echo "FAIL: action succeeded but repository-uri output is empty"
              exit 1
            fi
            # Public ECR URIs typically contain public.ecr.aws
            if echo "$REPO_URI" | grep -q "public.ecr.aws"; then
              echo "PASS: public ECR repository-uri = $REPO_URI"
            else
              echo "WARN: repository-uri does not contain public.ecr.aws: $REPO_URI"
              echo "PASS: repository-uri is non-empty"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
