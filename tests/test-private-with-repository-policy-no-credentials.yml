name: Test private ECR repository creation with repository-policy fails without AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal repository policy file
        run: |
          cat > /tmp/repository-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'false'
          repository: test-repo-with-policy
          repository-policy: /tmp/repository-policy.json
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed due to missing AWS credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials but got outcome=${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected without AWS credentials"
