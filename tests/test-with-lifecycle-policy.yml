name: Test ECR repository creation with lifecycle policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create lifecycle policy fixture file
        run: |
          cat > /tmp/lifecycle-policy.json << 'EOF'
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
          EOF
          echo "Lifecycle policy file created at /tmp/lifecycle-policy.json"
          cat /tmp/lifecycle-policy.json

      - id: action
        uses: .
        with:
          public: 'false'
          repository: my-repo-with-lifecycle
          lifecycle-policy: /tmp/lifecycle-policy.json
        continue-on-error: true

      - name: Check action ran with lifecycle policy
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPO_URI: ${{ steps.action.outputs.repository-uri }}
        run: |
          echo "outcome: $OUTCOME"
          echo "repository-uri: $REPO_URI"
          # Without real AWS credentials, the action is expected to fail
          # We verify it ran (not skipped) and didn't produce an unexpected outcome
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -n "$REPO_URI" ]; then
              echo "repository-uri: $REPO_URI"
              if echo "$REPO_URI" | grep -q "my-repo-with-lifecycle"; then
                echo "PASS: repository-uri contains repository name"
              else
                echo "FAIL: repository-uri does not contain repository name"
                exit 1
              fi
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected without real AWS credentials)"
            echo "PASS: action ran and failed gracefully with lifecycle-policy"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
