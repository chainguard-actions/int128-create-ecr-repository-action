name: Test ECR repository creation with lifecycle policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with lifecycle policy (expect failure without real AWS creds)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          public: 'false'
          repository: test-repo-with-lifecycle
          lifecycle-policy: >-
            ${{ github.workspace }}/pristine/int128--create-ecr-repository-action/v1.469.0/tests/fixtures/lifecycle-policy.json

      - name: Assert action ran (outcome is failure due to invalid AWS creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected outcome to be 'failure' or 'success', got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran and produced a valid outcome"
