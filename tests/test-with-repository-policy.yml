name: Test ECR repository creation with repository policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify repository policy fixture exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/repository-policy.json" ]; then
            echo "FAIL: repository policy fixture file not found"
            exit 1
          fi
          echo "PASS: repository policy fixture file found"
          cat "$GITHUB_WORKSPACE/tests/fixtures/repository-policy.json"

      - id: create-repo
        uses: .
        with:
          public: 'false'
          repository: test-repo-with-policy
          repository-policy: tests/fixtures/repository-policy.json
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed with AWS error (not input error)
        env:
          OUTCOME: ${{ steps.create-repo.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid AWS credentials,
          # not because of missing/invalid inputs or missing repository policy file.
          # This confirms the action correctly processes the repository-policy input.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no real AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real AWS credentials available)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
