name: Test public ECR with lifecycle-policy throws error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy lifecycle policy file
        run: |
          mkdir -p /tmp/ecr-test
          echo '{"rules":[]}' > /tmp/ecr-test/lifecycle-policy.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'true'
          repository: test-repo
          lifecycle-policy: /tmp/ecr-test/lifecycle-policy.json

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action failed as expected"
