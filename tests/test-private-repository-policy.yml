name: Test private ECR repository with repository policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert fixture exists
        run: |
          test -f "$GITHUB_WORKSPACE/tests/fixtures/repository-policy.json" || { echo "FAIL: fixture missing"; exit 1; }
          echo "PASS"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-test/repo-policy
          repository-policy: tests/fixtures/repository-policy.json
      - name: Assert action ran (URI set, or failed gracefully without AWS credentials)
        env:
          RESULT: ${{ steps.action.outputs.repository-uri }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            case "$RESULT" in
              *.dkr.ecr.*amazonaws.com/actionchain-test/repo-policy) echo "PASS: got '$RESULT'" ;;
              *) echo "FAIL: unexpected repository-uri '$RESULT'"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
