name: Test ECR Public repository creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAMOCKMOCKMOCKMOCK
      AWS_SECRET_ACCESS_KEY: mock-secret-access-key
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock ECR server (repository not found)
        run: |
          rm -f /tmp/mock-ecr.log
          touch /tmp/mock-ecr.log
          MOCK_MODE=notfound nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-ecr-server.cjs" 4566 /tmp/mock-ecr.log > /tmp/mock-server.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4566/; then echo "mock up"; exit 0; fi
            sleep 1
          done
          cat /tmp/mock-server.out
          echo "FAIL: mock server did not start"
          exit 1
      - id: action
        uses: .
        with:
          public: "true"
          repository: public-app
          repository-policy: tests/fixtures/repository-policy.json
      - name: Assert repository-uri
        env:
          ACTUAL: ${{ steps.action.outputs.repository-uri }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "public.ecr.aws/abcd1234/public-app" ]; then
            echo "FAIL: unexpected repository-uri"
            exit 1
          fi
          echo "PASS"
      - name: Assert ECR Public API was used
        run: |
          cat /tmp/mock-ecr.log
          grep -q '^SpencerFrontendService.DescribeRepositories' /tmp/mock-ecr.log || { echo "FAIL: public DescribeRepositories not called"; exit 1; }
          grep -q '^SpencerFrontendService.CreateRepository.*"public-app"' /tmp/mock-ecr.log || { echo "FAIL: public CreateRepository not called"; exit 1; }
          grep 'SpencerFrontendService.SetRepositoryPolicy' /tmp/mock-ecr.log | grep -q 'repo-policy-mock-marker' || { echo "FAIL: public repository policy not sent"; exit 1; }
          if grep -q 'AmazonEC2ContainerRegistry' /tmp/mock-ecr.log; then
            echo "FAIL: private ECR API should not be called"
            exit 1
          fi
          echo "PASS"
