name: Test with repository policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create repository policy fixture
        run: |
          mkdir -p /tmp/ecr-policy
          cat > /tmp/ecr-policy/repository-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "AllowPush",
                "Effect": "Allow",
                "Principal": {
                  "AWS": "arn:aws:iam::123456789012:root"
                },
                "Action": [
                  "ecr:GetDownloadUrlForLayer",
                  "ecr:BatchGetImage",
                  "ecr:BatchCheckLayerAvailability",
                  "ecr:PutImage",
                  "ecr:InitiateLayerUpload",
                  "ecr:UploadLayerPart",
                  "ecr:CompleteLayerUpload"
                ]
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'false'
          repository: test-repo-with-policy
          repository-policy: /tmp/ecr-policy/repository-policy.json

      - name: Assert action ran (outputs set, or failed gracefully without AWS credentials)
        env:
          RESULT: ${{ steps.action.outputs.repository-uri }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but repository-uri output is empty"
              exit 1
            fi
            echo "PASS: got repository-uri '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no AWS credentials available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
