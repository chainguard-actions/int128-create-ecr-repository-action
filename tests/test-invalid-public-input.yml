name: Test invalid public input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'maybe'
          repository: some-repo
      - name: Assert action failed on non-boolean input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.repository-uri }}
        run: |
          echo "outcome: $OUTCOME"
          echo "repository-uri: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid boolean input"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: repository-uri should be empty"
            exit 1
          fi
          echo "PASS"
