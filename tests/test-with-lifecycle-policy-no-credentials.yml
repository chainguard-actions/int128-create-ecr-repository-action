name: Test ECR repository with lifecycle policy - no credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a lifecycle policy file
        run: |
          cat > /tmp/lifecycle-policy.json << 'EOF'
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire images older than 30 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 30
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
          EOF

      - name: Run action with lifecycle policy without AWS credentials (expect failure)
        id: action
        uses: .
        with:
          public: 'false'
          repository: test-repo-with-lifecycle
          lifecycle-policy: /tmp/lifecycle-policy.json
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_REGION: us-east-1

      - name: Assert action failed due to missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials (lifecycle policy path)"
