name: Test public ECR rejects lifecycle policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create lifecycle policy file
        run: |
          cat > "$RUNNER_TEMP/lifecycle.json" <<'EOF'
          {"rules":[{"rulePriority":1,"description":"expire","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          public: "true"
          repository: act-harness-test-repo
          lifecycle-policy: ${{ runner.temp }}/lifecycle.json
      - name: Assert action failed (ECR Public does not support lifecycle policy)
        env:
          RESULT: ${{ steps.action.outputs.repository-uri }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: repository-uri should be empty"
            exit 1
          fi
          echo "PASS"
