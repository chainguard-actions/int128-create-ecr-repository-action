name: Test public ECR registry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set fake AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
      - id: action
        uses: .
        with:
          public: 'true'
          repository: test-public-repo
        continue-on-error: true
      - name: Assert action ran with public registry option
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid AWS credentials, not due to a code bug
          # We accept either 'success' or 'failure' (expected with fake creds)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
