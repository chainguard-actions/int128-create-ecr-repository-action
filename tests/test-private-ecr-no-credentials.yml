name: Test private ECR repository creation without AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          public: 'false'
          repository: test-repo-private
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed due to missing AWS credentials (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without real AWS credentials, the action should fail with an AWS error.
          # We verify it fails (not succeeds unexpectedly) and that it ran at all.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
